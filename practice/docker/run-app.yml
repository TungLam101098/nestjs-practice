version: "3"
services:
  database:
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  app:
    build:
      context: ../
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://database:27017/mydatabase
    volumes:
      - type: bind
        source: ../
        target: /app


volumes:
  mongo-data:
