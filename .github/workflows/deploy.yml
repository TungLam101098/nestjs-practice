name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Install dependencies and build application inside nestjs-practice folder
      - name: Install dependencies
        working-directory: nestjs-practice
        run: npm install

      - name: Build application
        working-directory: nestjs-practice
        run: npm run build

      # Deploy to VPS
      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          ssh -o StrictHostKeyChecking=no -i private_key $VPS_USER@$VPS_HOST << 'EOF'
            cd /nestjs-practice
            git fetch origin
            git checkout develop
            git pull origin develop
            cd nestjs-practice

            # Ghi nội dung từ ENV_FILE vào file .env
            echo "$ENV_FILE" > .env

            # Kiểm tra nội dung .env (tùy chọn, để debug)
            echo "---------- .env ----------"
            cat .env
            echo "--------------------------"

            # Chạy docker compose
            docker compose --env-file .env \
              -f docker/docker-compose.database.yaml \
              -f docker/docker-compose.cache.yaml \
              -f docker/docker-compose.prod.yaml \
              up --build -d
          EOF