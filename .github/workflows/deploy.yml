name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Node.js (dùng phiên bản 20 để tương thích)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Cập nhật lên 20 để tránh cảnh báo

      # Install dependencies and build application inside nestjs-practice folder
      - name: Install dependencies
        working-directory: nestjs-practice
        run: npm install

      - name: Build application
        working-directory: nestjs-practice
        run: npm run build

      # Deploy to VPS
      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
          # Debug: Check the contents of the private key
          head -n 2 private_key
          ssh -v -o StrictHostKeyChecking=no -i private_key $VPS_USER@$VPS_HOST << 'EOF'
            mkdir -p /nestjs-practice
            cd /nestjs-practice
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/TungLam101098/nestjs-practice.git
            fi
            git fetch origin
            git checkout develop
            git pull origin develop
            cd nestjs-practice
            npm install
            npm run build
            cd docker
            docker-compose down
            docker-compose --env-file ../.env -f docker-compose.database.yaml -f docker-compose.cache.yaml -f docker-compose.prod.yaml up --build -d
          EOF
          rm private_key